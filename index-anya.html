<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренировки</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="theme-color" content="#14171C">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#241A21; --bg2:#2E212A; --card:#33242E; --line:#45303C;
  --ink:#F2E4EA; --ink2:#B998A9;
  --rose:#D98C97; --rose-d:#8A5A68; --sage:#9DB098; --gold:#D9B23C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:86px}
.wrap{max-width:600px;margin:0 auto;padding:0 15px}

header{position:sticky;top:0;z-index:20;background:var(--bg2);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);
  position:relative;overflow:hidden}
.vine{position:absolute;top:-6px;right:-6px;opacity:.4;pointer-events:none}
.htop{padding:14px 15px 0;position:relative;z-index:2}
h1{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:22px;margin:0}
.hsub{font-size:11.5px;color:var(--ink2);margin-top:2px}
.tabs{display:flex;gap:6px;padding:11px 15px 9px;position:relative;z-index:2}
.tab{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink2);
  border-radius:18px;padding:8px 3px;font-size:11px;font-weight:600;cursor:pointer;
  line-height:1.25;text-align:center}
.tab.on{background:var(--rose);color:#241A21;border-color:var(--rose);font-weight:700}
.bar{display:flex;align-items:center;gap:7px;padding:0 15px 11px;position:relative;z-index:2}
.blab{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.gyms{display:flex;gap:5px;flex:1;overflow-x:auto}
.gym{flex:1;min-width:66px;border:1px solid var(--line);background:transparent;color:var(--ink2);
  border-radius:14px;padding:6px 8px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.gym.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gym.add{flex:0 0 34px;min-width:34px;border-style:dashed;font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:15px;
  margin:13px 0;overflow:hidden}
.ctop{padding:14px 16px 12px;position:relative}
.bloom{position:absolute;top:13px;right:14px}
.enum{font-family:Georgia,serif;font-style:italic;font-size:11.5px;color:var(--rose);letter-spacing:.03em}
.ename{font-family:Georgia,serif;font-size:17px;margin:2px 0 0;padding-right:42px;line-height:1.3}
.motto{font-size:11.5px;color:var(--ink2);font-style:italic;margin-top:3px}
.pick{width:100%;margin-top:10px;background:#2A1E25;color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;
  appearance:none;cursor:pointer;padding-right:32px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7'><path d='M1 1l4.5 4.5L10 1' stroke='%23B998A9' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
.board{display:flex;align-items:baseline;gap:8px;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--line)}
.kg{font-family:Georgia,serif;font-size:37px;line-height:.85;cursor:pointer}
.unit{font-size:12px;color:var(--ink2)}
.plus{margin-left:auto;font-size:10.5px;color:var(--sage);text-align:right;line-height:1.4}
.edit{display:flex;gap:5px;margin-top:10px}
.eb{flex:1;background:transparent;border:1px dashed var(--line);color:var(--ink2);
  border-radius:9px;padding:7px;font-size:11.5px;font-weight:500;cursor:pointer;
  font-family:-apple-system,sans-serif}
.eb.mv{flex:0 0 38px;font-size:14px;line-height:1}
.eb.mv:disabled{opacity:.25}
.eb.del{flex:0 0 38px;color:var(--rose);border-color:var(--rose-d)}
.sets{background:rgba(0,0,0,.17);border-top:1px solid var(--line)}
.set{display:flex;align-items:center;gap:7px;padding:8px 16px;border-bottom:1px solid rgba(69,48,60,.6)}
.set:last-child{border-bottom:none}
.sn{font-family:Georgia,serif;font-size:11.5px;color:var(--ink2);width:58px;flex-shrink:0}
.sn i{color:var(--gold);font-style:normal;font-weight:700}
.inp{background:#2A1E25;border:1px solid var(--line);border-radius:9px;color:var(--ink);
  font-family:Georgia,serif;font-size:16px;padding:7px 5px;text-align:center;width:100%;min-width:0}
.inp:focus{outline:none;border-color:var(--rose)}
.inp::placeholder{color:#6E5460}
.f{flex:1;min-width:0}
.sep{color:var(--ink2);font-size:13px}
.chk{width:31px;height:31px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--rose-d);
  background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.chk.on{background:var(--rose);border-color:var(--rose)}
.hint{padding:8px 16px;font-size:11px;color:var(--ink2);border-top:1px solid rgba(69,48,60,.6)}
.hint b{color:var(--ink)}
.addex{width:100%;margin:4px 0 18px;background:transparent;border:1px dashed var(--line);
  color:var(--ink2);border-radius:12px;padding:13px;font-size:13.5px;font-weight:600;cursor:pointer;
  font-family:-apple-system,sans-serif}
.foot{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg2);
  border-top:1px solid var(--line);padding:9px 15px calc(9px + env(safe-area-inset-bottom));
  display:flex;gap:7px;align-items:center;max-width:600px;margin:0 auto}
.prog{flex:1;min-width:0}
.ptxt{font-size:11px;color:var(--ink2)}
.ptxt b{font-family:Georgia,serif;font-size:15px;color:var(--ink);font-weight:400}
.pbar{height:5px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden;margin-top:5px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--rose-d),var(--rose));
  border-radius:3px;transition:width .3s}
.btn{border:none;border-radius:10px;padding:11px 15px;font-size:13px;font-weight:600;
  cursor:pointer;background:var(--rose);color:#241A21;font-family:-apple-system,sans-serif}
.btn.g{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:var(--bg);padding:10px 17px;border-radius:10px;font-size:12.5px;
  font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#hist{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  padding:14px 14px calc(24px + env(safe-area-inset-bottom));padding-top:calc(14px + env(safe-area-inset-top))}
.hwrap{max-width:600px;margin:0 auto}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.hhead b{font-size:16px;font-weight:600}
.hempty{opacity:.6;font-size:13px;line-height:1.6;padding:26px 4px}
.hcard{background:CARD;border-radius:13px;padding:13px 15px;margin-bottom:11px;border:1px solid LINE}
.hname{font-size:14.5px;font-weight:600;margin-bottom:7px}
.htop2{display:flex;align-items:center;gap:9px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid LINE}
.htop2 .up{color:#4CAF6D;font-size:12.5px;font-weight:600}
.htop2 .dn{color:#D98C97;font-size:12.5px;font-weight:600}
.htop2 .fl{opacity:.55;font-size:12.5px}
.hcnt{opacity:.5;font-size:11.5px;margin-right:auto}
.hrow{display:flex;gap:11px;padding:4px 0;font-size:12.5px}
.hdate{opacity:.55;width:44px;flex-shrink:0;font-variant-numeric:tabular-nums}
.hsets{font-variant-numeric:tabular-nums}
.hsets i{opacity:.5;font-style:normal}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── шапка как в мужской версии, но в своей палитре ── */
.days{display:flex;gap:6px;padding:12px 15px 8px;position:relative;z-index:2}
.day{
  flex:1;border:none;border-radius:10px;padding:10px 5px;cursor:pointer;
  background:var(--card);color:var(--ink2);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  line-height:1.2;border-bottom:3px solid transparent;transition:.15s;
}
.day.on{background:var(--bg2);color:var(--ink);border-bottom-color:var(--rose)}
.day.wide{flex:0 0 40px;font-size:16px;padding:10px 2px;text-transform:none}
.tempmark{color:var(--gold);font-size:9px;margin-top:2px;text-transform:none;letter-spacing:0}

.bar-label{font-size:10.5px;color:var(--ink2);text-transform:uppercase;
  letter-spacing:.08em;flex-shrink:0}

.wrap{max-width:600px;margin:0 auto;padding:0 15px}
.title{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:21px;
  margin:15px 0 1px;color:var(--ink)}
.sub{font-size:11.5px;color:var(--ink2);margin-bottom:3px}

.card{background:var(--card);border:1px solid var(--line);border-radius:15px;
  margin:13px 0;overflow:hidden}
.card-top{padding:14px 16px 12px;position:relative}
.set-n{font-family:Georgia,serif;font-size:11.5px;color:var(--ink2);width:20px;flex-shrink:0}
.board-num{font-family:Georgia,serif;font-size:37px;line-height:.85;cursor:pointer}
.board-unit{font-size:12px;color:var(--ink2)}
.board-tag{margin-left:auto;font-size:10.5px;color:var(--sage);text-align:right;line-height:1.4}
.done{width:31px;height:31px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--rose-d);
  background:transparent;color:var(--ink2);cursor:pointer;font-size:14px;padding:0}
.done.on{background:var(--rose);border-color:var(--rose);color:#241A21}
.stat{flex:1;font-size:11px;color:var(--ink2);line-height:1.35}
.stat b{color:var(--ink);font-family:Georgia,serif;font-size:15px;font-weight:400}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.slot{font-family:Georgia,serif;font-size:11.5px;color:var(--rose);font-style:italic;
  display:flex;justify-content:space-between;align-items:center}
.hidebtn{width:100%;margin:2px 0 16px;background:transparent;border:1px dashed var(--line);
  color:var(--ink2);border-radius:10px;padding:10px;font-size:12px;cursor:pointer;
  font-family:-apple-system,sans-serif}
.addex{width:100%;margin:4px 0 18px;background:transparent;border:1px dashed var(--line);
  color:var(--ink2);border-radius:12px;padding:13px;font-size:13.5px;font-weight:600;
  cursor:pointer;font-family:-apple-system,sans-serif}
.scheme{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 8px;
  font-size:11px;color:var(--ink);cursor:pointer;margin-left:8px;font-style:normal;
  font-family:-apple-system,sans-serif;font-weight:700}
#hist{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  padding:14px 14px calc(24px + env(safe-area-inset-bottom));
  padding-top:calc(14px + env(safe-area-inset-top))}
.hwrap{max-width:600px;margin:0 auto}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.hhead b{font-size:16px}
.hempty{color:var(--ink2);font-size:13px;line-height:1.6;padding:22px 4px}
.hcard{background:var(--card);border-radius:13px;padding:13px 15px;margin-bottom:11px;
  border:1px solid var(--line)}
.hname{font-size:14.5px;font-weight:600;margin-bottom:7px}
.htop2{display:flex;align-items:center;gap:9px;margin-bottom:9px;padding-bottom:9px;
  border-bottom:1px solid var(--line)}
.htop2 .up{color:var(--sage);font-size:12.5px;font-weight:600}
.htop2 .dn{color:var(--rose);font-size:12.5px;font-weight:600}
.htop2 .fl{color:var(--ink2);font-size:12.5px}
.hcnt{color:var(--ink2);font-size:11.5px;margin-right:auto}
.hrow{display:flex;gap:11px;padding:4px 0;font-size:12.5px}
.hdate{color:var(--ink2);width:44px;flex-shrink:0}
.hsets i{color:var(--ink2);font-style:normal}
#modal{position:fixed;inset:0;z-index:60;background:rgba(20,14,18,.9);display:none;
  overflow-y:auto;padding:0 14px 40px;padding-top:calc(20px + env(safe-area-inset-top))}
.mwrap{max-width:600px;margin:0 auto}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mhead b{font-size:16px}
.mgroup{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);
  margin:16px 0 7px}
.mitem{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  color:var(--ink);border-radius:11px;padding:13px 15px;font-size:14px;margin-bottom:7px;
  cursor:pointer;font-family:-apple-system,sans-serif;display:flex;align-items:center;gap:9px}
.mitem small{color:var(--ink2);font-size:11.5px;margin-left:auto;text-align:right}
.minput{width:100%;padding:13px 14px;border-radius:11px;font-size:16px;
  border:1px solid var(--line);background:rgba(0,0,0,.2);color:inherit;
  font-family:-apple-system,sans-serif;margin-bottom:10px}
.mrow{display:flex;gap:8px}
.mbtn{justify-content:center;font-weight:600}
.mbtn.ok{background:rgba(255,255,255,.12)}
.mnote{color:var(--ink2);font-size:12px;line-height:1.6;margin:4px 0 14px}
.eb{flex:1;background:transparent;border:1px dashed var(--line);color:var(--ink2);
  border-radius:9px;padding:7px;font-size:11.5px;font-weight:500;cursor:pointer;
  font-family:-apple-system,sans-serif}
.eb.mv{flex:0 0 38px;font-size:14px;line-height:1}
.eb.mv:disabled{opacity:.25}
.eb.hide{flex:0 0 38px;color:var(--ink2)}
.eb.yt{flex:0 0 38px;color:var(--rose);border-color:var(--rose-d);font-size:11px}
.ytmini{flex-shrink:0;color:var(--rose);font-size:12px;padding:4px 9px;margin-left:8px;
  border:1px solid var(--rose-d);border-radius:7px;cursor:pointer}

/* ── доработки v2 ── */
.tab.wide{flex:0 0 40px;font-size:16px;padding:11px 2px}
.hidebtn{width:100%;margin:2px 0 16px;background:transparent;border:1px dashed var(--line);
  color:var(--mute);border-radius:10px;padding:10px;font-size:12px;cursor:pointer;
  font-family:-apple-system,sans-serif}
.scheme{display:inline-block;border:1px solid var(--line);border-radius:6px;
  padding:1px 7px;font-size:11px;color:var(--chalk);cursor:pointer;margin-left:7px;
  font-family:-apple-system,sans-serif;font-weight:600}
.eb.hide{flex:0 0 38px;color:var(--mute)}
.eb.yt{flex:0 0 38px;color:#FF4B4B;border-color:rgba(255,75,75,.35);font-size:11px;
  text-decoration:none;display:flex;align-items:center;justify-content:center}
.ytmini{text-decoration:none;display:inline-block}
.ytmini{flex-shrink:0;color:#FF4B4B;font-size:12px;padding:4px 9px;margin-left:8px;
  border:1px solid rgba(255,75,75,.3);border-radius:7px;cursor:pointer}
.mitem{cursor:pointer}
.tempmark{color:var(--yellow);font-size:10px;margin-left:5px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(15,17,22,.88);
  display:none;overflow-y:auto;padding:0 14px 40px;
  padding-top:calc(20px + env(safe-area-inset-top))}
.mwrap{max-width:600px;margin:0 auto}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mhead b{font-size:16px}
.mgroup{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);
  margin:16px 0 7px}
.mitem{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  color:var(--chalk);border-radius:11px;padding:13px 15px;font-size:14px;margin-bottom:7px;
  cursor:pointer;font-family:-apple-system,sans-serif;display:flex;align-items:center;gap:9px}
.mitem:active{background:var(--surface2)}
.mitem small{color:var(--mute);font-size:11.5px;margin-left:auto;text-align:right}
.minput{width:100%;padding:13px 14px;border-radius:11px;font-size:16px;
  border:1px solid var(--line);background:rgba(0,0,0,.2);color:inherit;
  font-family:-apple-system,sans-serif;margin-bottom:10px}
.mrow{display:flex;gap:8px}
.mbtn{justify-content:center;font-weight:600}
.mbtn.ok{background:rgba(255,255,255,.12)}
.mnote{color:var(--mute);font-size:12px;line-height:1.6;margin:4px 0 14px}
</style>
</head>
<body>

<header>
  <div class="days" id="days"></div>
  <div class="bar">
    <span class="bar-label">Зал</span>
    <div class="gyms" id="gyms"></div>
  </div>
</header>

<div class="wrap">
  <div class="title" id="dayTitle"></div>
  <div class="sub" id="daySub"></div>
  <div id="list"></div>
</div>

<div class="foot">
  <div class="stat" id="stat"></div>
  <button class="btn g" onclick="showHist()">📈</button>
  <button class="btn g" onclick="exportData()">⤓</button>
  <label class="btn g" style="cursor:pointer">⤒<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label>
  <button class="btn g" id="clearBtn">Сброс</button>
  <button class="btn" id="saveBtn">Готово</button>
</div>

<div id="hist" style="display:none"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>

function buildDays(){
  DAYS = BASE.map(d => ({name:d.name, short:d.short, id:null, ex:d.ex.map(x=>[x[0],x[1],x[2],x[3],x[4].map(v=>[v[0], Array.isArray(v[1])?v[1].slice():[v[1]||0], v[2]]),x[5]])}));
  (custom.temp||[]).forEach(t=>{
    DAYS.push({name:t.name, short:t.name, id:t.id, temp:true,
      ex:(t.ex||[]).map(x=>[x[0],x[1],x[2],x[3]||"",x[4].map(v=>[v[0], Array.isArray(v[1])?v[1].slice():[v[1]||0], true]),true])});
  });
}
function dk(d){ return DAYS[d] && DAYS[d].id ? DAYS[d].id : String(d); }   // ключ дня
function key(d,e){ return dk(d)+":"+e }
function wKey(d,e,vi,g){ return dk(d)+":"+e+":"+vi+":"+g }
function wGet(d,e,vi,g){
  const k=wKey(d,e,vi,g);
  if(custom.w && custom.w[k]!==undefined) return custom.w[k];
  const a=DAYS[d].ex[e][4][vi][1];
  return (a&&a[g]!==undefined)?a[g]:(a&&a[0]!==undefined?a[0]:0);
}
function wSet(d,e,vi,g,v){ custom.w=custom.w||{}; custom.w[wKey(d,e,vi,g)]=v; }
function cur(d,e){
  const k=key(d,e);
  if(!state[k]) state[k]={v:0, sets:Array.from({length:DAYS[d].ex[e][2]},()=>({w:"",r:"",done:false}))};
  const need=DAYS[d].ex[e][2], have=state[k].sets.length;
  if(have<need) for(let i=have;i<need;i++) state[k].sets.push({w:"",r:"",done:false});
  if(have>need) state[k].sets.length=need;
  return state[k];
}
function recWeight(d,e){ return wGet(d,e,cur(d,e).v,gym)||0; }
function stepFor(w){ return w>=20 ? 2.5 : (w>0 ? 1 : 0); }   // штанга/тренажёр +2,5 · гантели +1
function hiddenList(d){ return (custom.hidden||{})[dk(d)] || []; }
function isHidden(d,name){ return hiddenList(d).includes(name); }

function applyCustom(){
  buildDays();
  Object.keys(custom.ex||{}).forEach(k=>{
    const d=DAYS.findIndex(x=>dk(DAYS.indexOf(x))===k);
    if(d<0) return;
    (custom.ex[k]||[]).forEach(x=>{
      if(!DAYS[d].ex.some(q=>q[0]===x[0]))
        DAYS[d].ex.unshift([x[0],x[1],x[2],x[3]||"",x[4].map(v=>[v[0], Array.isArray(v[1])?v[1].slice():[v[1]||0], true]),true]);
    });
  });
  Object.keys(custom.schemes||{}).forEach(k=>{
    const [dkey,name]=k.split("|");
    const d=DAYS.findIndex((x,i)=>dk(i)===dkey);
    if(d<0) return;
    const ex=DAYS[d].ex.find(q=>q[0]===name);
    if(ex){ ex[1]=custom.schemes[k].s; ex[2]=custom.schemes[k].n; }
  });
  Object.keys(custom.order||{}).forEach(k=>{
    const d=DAYS.findIndex((x,i)=>dk(i)===k);
    if(d<0) return;
    const want=custom.order[k], by={};
    DAYS[d].ex.forEach(x=>by[x[0]]=x);
    const out=[]; want.forEach(n=>{ if(by[n]){ out.push(by[n]); delete by[n]; } });
    DAYS[d].ex.forEach(x=>{ if(by[x[0]]) out.push(x); });
    if(out.length===DAYS[d].ex.length) DAYS[d].ex=out;
  });
  Object.keys(custom.vars||{}).forEach(k=>{
    const p=k.split(":"), dkey=p[0], e=+p[1];
    const d=DAYS.findIndex((x,i)=>dk(i)===dkey);
    if(d<0||!DAYS[d].ex[e]) return;
    (custom.vars[k]||[]).forEach(v=>{
      if(!DAYS[d].ex[e][4].some(q=>q[0]===v[0])) DAYS[d].ex[e][4].push([v[0],v[1].slice(),true]);
    });
  });
}
function saveCustom(){ try{ localStorage.setItem("anya:custom", JSON.stringify(custom)); }catch(e){} }

    + `<button class="day wide" data-d="1" onclick="addTempDay()" title="Разовая тренировка">＋</button>`;

    `<button class="gym ${i===gym?'on':''}" onclick="${i===gym?'editGym()':'setGym('+i+')'}">${g}</button>`).join("")
    + `<button class="gym add" onclick="addGym()">＋</button>`;

    : "") ;
}

        <div class="enum">упражнение ${pos+1}<span class="scheme" onclick="editScheme(${e})">${scheme}</span></div>
        <div class="ename">${slot}</div>
        ${motto?`<div class="motto">«${motto}»</div>`:""}
        <select class="pick" ${vars.length<2?'disabled':''} onchange="setVar(${e},this.value)">${opts}</select>
        <div class="board">
          <span class="kg" onclick="editW(${e})">${w||"—"}</span><span class="unit">кг</span>
          ${w&&step?`<span class="plus">последний подход<br>${w+step} кг</span>`:`<span class="plus">${GYMS[gym]}</span>`}
        </div>
        <div class="edit">
          <button class="eb mv" onclick="move(${e},-1)" ${pos===0?'disabled':''}>↑</button>
          <button class="eb mv" onclick="move(${e},1)" ${pos===vis.length-1?'disabled':''}>↓</button>
          <button class="eb yt" onclick="watch('${esc(vname)}')" title="Как делать">▶</button>
          <button class="eb" onclick="addVar(${e})">＋ вариант</button>
          <button class="eb hide" onclick="hideEx(${e})" title="Убрать или удалить">✕</button>
        </div>
      </div>
      <div class="sets">${sets}</div>
      ${hint}
    </div>`;
  }).join("");

  const hid = hiddenList(day).length;
  const hidBtn = hid ? `<button class="hidebtn" onclick="showHidden()">Скрытые упражнения: ${hid} — вернуть</button>` : "";
  const delDay = DAYS[day].temp ? `<button class="hidebtn" style="color:#C8102E;border-color:rgba(200,16,46,.4)" onclick="delTempDay()">Удалить разовую тренировку</button>` : "";
  $("#list").innerHTML = cards
    + `<button class="addex" onclick="addEx()">＋ добавить упражнение</button>`
    + hidBtn + delDay;
  drawStat();
}

function drawStat(){
  let done=0,all=0,vol=0;
  DAYS[day].ex.forEach((ex,e)=>{
    if(isHidden(day,ex[0])) return;
    cur(day,e).sets.forEach(s=>{ all++; if(s.done) done++;
      const w=parseFloat(String(s.w).replace(",",".")), r=parseInt(s.r);
      if(w&&r) vol+=w*r; });
  });
  $("#stat").innerHTML = `<b>${done}</b>/${all} подходов${vol?` · тоннаж <b>${Math.round(vol)}</b> кг`:""}`;
}

/* ── базовые действия ── */
const setDay = i => { view="day"; day=i; drawHeader(); drawList(); save(true); };
const setGym = i => { gym=i; drawHeader(); drawList(); save(true); };

const upd = (e,i,f,val) => { cur(day,e).sets[i][f]=val; drawStat(); save(true); };
const tog = (e,i) => { const s=cur(day,e).sets[i]; s.done=!s.done;
  if(s.done&&!s.w){ const w=recWeight(day,e), isLast=i===cur(day,e).sets.length-1;

/* ── скрытие / возврат ── */
function hideEx(e){
  const ex = DAYS[day].ex[e];
  const isMine = !!ex[5];                       // добавлено пользователем
  const n = ex[0];
  let html = `<div class="mnote">${n}</div>`;

  if(isMine) html += `<div class="mitem" onclick="doDelete('${esc(n)}')" style="color:#C8102E">Удалить совсем<small>это упражнение добавлено вами</small></div>`;
  const vi = cur(day,e).v, v = ex[4][vi];
  if(v && v[2] && ex[4].length>1)
    html += `<div class="mitem" onclick="doDelVar(${e})" style="color:#C8102E">Удалить вариант «${v[0]}»<small>вариант добавлен вами</small></div>`;

function doHide(n){
  custom.hidden=custom.hidden||{};
  custom.hidden[dk(day)]=(custom.hidden[dk(day)]||[]).concat([n]);
  saveCustom(); closeModal(); drawHeader(); drawList(); toast("Убрано с экрана");
}

function doDelete(n){
  const i = DAYS[day].ex.findIndex(x=>x[0]===n);
  if(i<0) return;
  DAYS[day].ex.splice(i,1);
  custom.ex[dk(day)] = (custom.ex[dk(day)]||[]).filter(x=>x[0]!==n);
  if(!custom.ex[dk(day)].length) delete custom.ex[dk(day)];
  custom.order=custom.order||{}; custom.order[dk(day)]=DAYS[day].ex.map(x=>x[0]);
  delete state[key(day,i)]; delete last[key(day,i)];
  saveCustom(); closeModal(); save(true); drawHeader(); drawList(); toast("Удалено");
}

function doDelVar(e){
  const ex=DAYS[day].ex[e], st=cur(day,e), v=ex[4][st.v];
  if(!v || !v[2]) return;
  ex[4].splice(st.v,1);
  const k=key(day,e);
  custom.vars[k]=(custom.vars[k]||[]).filter(x=>x[0]!==v[0]);
  if(!custom.vars[k].length) delete custom.vars[k];
  st.v=0; saveCustom(); closeModal(); drawList(); toast("Вариант удалён");
}

function pickDayFor(name){
  const opts = DAYS.map((d,i)=>`<button class="mitem" onclick="addFromBase('${esc(name)}',${i})">${d.name}${d.temp?' <small>разовая</small>':''}</button>`).join("");
  openModal("В какой день добавить?", `<div class="mnote">${name}</div>`+opts);
};
function addFromBase(name, d){
  let src = allExercises().find(x=>x.name===name);
  if(!src){
    let found=null;
    Object.keys(CATALOG).forEach(g=>CATALOG[g].forEach(x=>{
      if(x[0]===name) found={name:x[0], scheme:x[2], sets:(parseInt(x[2])||3), vars:[[x[0],[0],true]], from:g};
    }));
    src=found;
  }
  if(!src) return;
  if(DAYS[d].ex.some(q=>q[0]===name)){
    // уже есть — просто вернём, если было скрыто
    if(isHidden(d,name)){
      custom.hidden[dk(d)]=hiddenList(d).filter(x=>x!==name);
      saveCustom(); closeModal(); setDay(d); toast("Возвращено в день");
    } else { closeModal(); setDay(d); toast("Это упражнение уже есть в дне"); }
    return;
  }
  const item=[src.name, src.scheme, src.sets, "", src.vars.map(v=>[v[0], Array.isArray(v[1])?v[1].slice():[v[1]||0], true])];
  custom.ex=custom.ex||{}; custom.ex[dk(d)]=custom.ex[dk(d)]||[];
  custom.ex[dk(d)].unshift(item);
  DAYS[d].ex.unshift([item[0],item[1],item[2],item[3],item[4],true]);
  custom.order=custom.order||{}; custom.order[dk(d)]=DAYS[d].ex.map(x=>x[0]);
  saveCustom(); closeModal(); setDay(d); toast("Добавлено наверх списка");
};

    `<input id="mi" class="minput" type="text" value="${c}">
     <div class="mrow"><button class="mitem mbtn" onclick="closeModal()">Отмена</button>

     ${GYMS.length>1?`<div class="mitem" style="color:#C8102E;margin-top:10px" onclick="__delGym()">Удалить зал вместе с весами</div>`:""}`);

      nw[p[0]+":"+p[1]+":"+p[2]+":"+(g>del?g-1:g)]=custom.w[k];

function move(e,dir){
  const L=DAYS[day].ex;
  const vis=L.map((x,i)=>i).filter(i=>!isHidden(day,L[i][0]));
  const at=vis.indexOf(e), t=vis[at+dir];
  if(t===undefined) return;
  [L[e],L[t]]=[L[t],L[e]];
  [state,last].forEach(obj=>{
    const a=obj[key(day,e)], b=obj[key(day,t)];
    if(a===undefined&&b===undefined) return;
    if(b===undefined) delete obj[key(day,e)]; else obj[key(day,e)]=b;
    if(a===undefined) delete obj[key(day,t)]; else obj[key(day,t)]=a;
  });
  const ca=custom.vars[key(day,e)], cb=custom.vars[key(day,t)];
  if(ca!==undefined||cb!==undefined){
    if(cb===undefined) delete custom.vars[key(day,e)]; else custom.vars[key(day,e)]=cb;
    if(ca===undefined) delete custom.vars[key(day,t)]; else custom.vars[key(day,t)]=ca;
  }
  custom.order=custom.order||{}; custom.order[dk(day)]=L.map(x=>x[0]);
  saveCustom(); save(true); drawList();
};
function addVar(e){
  askText("Новый вариант", "Название", "", function(n){
    askNumM("Рабочий вес, кг (0 — без веса)", 0, function(w){
      const k=key(day,e); custom.vars[k]=custom.vars[k]||[];
      const arr=[]; arr[gym]=w;
      custom.vars[k].push([n,arr,true]);
      DAYS[day].ex[e][4].push([n,arr,true]);
      const vi=DAYS[day].ex[e][4].length-1;
      wSet(day,e,vi,gym,w); cur(day,e).v=vi;
      saveCustom(); drawList(); toast("Вариант добавлен");
    });
  });
}

function editW(e){

  askNumM("Рабочий вес в зале «"+GYMS[gym]+"», кг", wGet(day,e,st.v,gym), function(w){

function addEx(){

  });
}

/* ── история ── */
function histFor(dkey){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith("anya:hist:")) continue;
    if(!k.endsWith(":"+dkey)) continue;
    try{ const o=JSON.parse(localStorage.getItem(k)); if(o&&o.items) out.push(o); }catch(e){}
  }
  return out.sort((a,b)=>a.date<b.date?1:-1);
}
function maxW(sets){ let m=0; sets.forEach(s=>{const w=parseFloat(String(s.w).replace(",",".")); if(w>m)m=w;}); return m; }
function spark(v){
  if(v.length<2) return "";
  const w=104,h=26,mn=Math.min(...v),mx=Math.max(...v),rg=(mx-mn)||1;
  const p=v.map((x,i)=>[(i/(v.length-1))*w, h-2-((x-mn)/rg)*(h-6)]);
  const d=p.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const L=p[p.length-1];
  return `<svg width="${w}" height="${h}" style="display:block"><path d="${d}" stroke="#C8102E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="2.6" fill="#C8102E"/></svg>`;
}
function showHist(){
  const H=histFor(dk(day)), box=$("#hist");
  if(!H.length){
    box.innerHTML=`<div class="hwrap"><div class="hhead"><b>История — ${DAYS[day].name}</b>
      <button class="btn g" onclick="hideHist()">Закрыть</button></div>
      <div class="hempty">Пока пусто. Заполни подходы и нажми «Готово».</div>
      <button class="hidebtn" onclick="restoreSeed()">Восстановить сохранённый архив (2 тренировки)</button></div>`;
    box.style.display="block"; return;
  }
  const names=[]; H.forEach(h=>h.items.forEach(it=>{ if(!names.includes(it.name)) names.push(it.name); }));
  const cards=names.map(n=>{
    const rows=H.filter(h=>h.items.some(it=>it.name===n))
      .map(h=>({date:h.date, sets:h.items.find(it=>it.name===n).sets}));
    const ser=rows.map(r=>maxW(r.sets)).reverse().filter(x=>x>0);
    let tr="";
    if(ser.length>1&&ser[0]){
      const d=+(ser[ser.length-1]-ser[0]).toFixed(1);
      tr = d>0?`<span class="up">+${d} кг</span>`:d<0?`<span class="dn">${d} кг</span>`:`<span class="fl">без изменений</span>`;
    }
    const list=rows.slice(0,8).map(r=>{
      const dd=r.date.slice(8,10)+"."+r.date.slice(5,7);
      return `<div class="hrow"><span class="hdate">${dd}</span><span class="hsets">${r.sets.map(s=>s.r?`${s.w||"—"}<i>/${s.r}</i>`:`${s.w||"—"}`).join("  ")}</span></div>`;
    }).join("");
    return `<div class="hcard"><div class="hname">${n}</div>
      <div class="htop2">${tr}<span class="hcnt">${rows.length} трен.</span>${spark(ser)}</div>${list}</div>`;
  }).join("");
  box.innerHTML=`<div class="hwrap"><div class="hhead"><b>История — ${DAYS[day].name}</b>
    <button class="btn g" onclick="hideHist()">Закрыть</button></div>${cards}</div>`;
  box.style.display="block";
};
function hideHist(){ $("#hist").style.display="none"; };

/* ── экспорт / импорт ── */
function exportData(){
  const dump={v:3, saved:new Date().toISOString(), state, last, custom, gyms:GYMS,
    hist:Object.keys(localStorage).filter(k=>k.startsWith("anya:hist:"))
      .reduce((a,k)=>(a[k]=localStorage.getItem(k),a),{})};
  const blob=new Blob([JSON.stringify(dump,null,1)],{type:"application/json"});
  const name="trenirovki-anya-"+new Date().toISOString().slice(0,10)+".json";
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([blob],name)]}))
    navigator.share({files:[new File([blob],name,{type:"application/json"})],title:"Тренировки"});
  else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }
  toast("Файл готов");
};
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const o=JSON.parse(rd.result);
    state=o.state||{}; last=o.last||{};
    if(o.custom){ custom=Object.assign({vars:{},ex:{},order:{},w:{},hidden:{},schemes:{},temp:[]}, o.custom); }
    if(Array.isArray(o.gyms)&&o.gyms.length) GYMS=o.gyms.slice();
    else if(custom.gyms) GYMS=custom.gyms.slice();
    if(o.hist) Object.keys(o.hist).forEach(k=>localStorage.setItem(k,o.hist[k]));
    saveCustom(); applyCustom(); save(true); drawHeader(); drawList(); toast("Данные загружены");
  }catch(e){ toast("Файл не читается"); } };
  rd.readAsText(f);
};

/* ── восстановление: история и настройки проверяются ОТДЕЛЬНО ── */
(function seed(){
  try{
    // 1) история — если нет ни одной записи, ставим сохранённые
    let hasHist=false;
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.startsWith("anya:hist:")){ hasHist=true; break; }
    }
    if(!hasHist && SEED.hist){
      Object.keys(SEED.hist).forEach(k=>localStorage.setItem(k, SEED.hist[k]));
      if(SEED.last){
        const byDay={};
        Object.keys(SEED.last).forEach(k=>{ const d=k.split(":")[0]; (byDay[d]=byDay[d]||{})[k]=SEED.last[k]; });
        Object.keys(byDay).forEach(d=>localStorage.setItem("anya:last:"+d, JSON.stringify(byDay[d])));
      }
    }
    // 2) настройки — только если их нет совсем
    if(!localStorage.getItem("anya:custom") && SEED.custom)
      localStorage.setItem("anya:custom", JSON.stringify(SEED.custom));
  }catch(e){}
})();

(function load(){
  try{
    const rc=localStorage.getItem("anya:custom");
    if(rc){ custom=Object.assign({vars:{},ex:{},order:{},w:{},hidden:{},schemes:{},temp:[]}, JSON.parse(rc));
      if(Array.isArray(custom.gyms)&&custom.gyms.length) GYMS=custom.gyms.slice(); }
    applyCustom();
    const r=localStorage.getItem("anya:current");
    if(r){ const o=JSON.parse(r); state=o.state||{};
      if(typeof o.gym==="number"&&o.gym<GYMS.length) gym=o.gym;
      if(typeof o.day==="number"&&o.day<DAYS.length) day=o.day; }
    // «прошлый раз» собираем по ВСЕМ дням
    for(let d=0; d<DAYS.length; d++){
      const x=localStorage.getItem("anya:last:"+dk(d));
      if(x){ const o=JSON.parse(x); Object.keys(o).forEach(k=>{ last[k]=o[k]; }); }
    }
    drawHeader(); drawList();
  }catch(e){}
})();

try{
  if("serviceWorker" in navigator && location.protocol.startsWith("http"))
    navigator.serviceWorker.register("sw.js").catch(()=>{});
}catch(e){}
